<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Three-Tap AI</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

<style>
* {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Poppins', sans-serif;
}

body {
    height: 100vh;
    background: linear-gradient(-45deg, #0f172a, #020617, #111827, #1e293b);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}


.chat-container {
    width: 420px;
    height: 85vh;
    background: rgba(15, 23, 42, 0.8);
    backdrop-filter: blur(15px);
    border-radius: 20px;
    box-shadow: 0 20px 60px rgba(0,0,0,0.6);
    display: flex;
    flex-direction: column;
    overflow: hidden;
}

/* Header */
.chat-header {
    padding: 18px;
    font-size: 20px;
    font-weight: 600;
    text-align: center;
    background: linear-gradient(90deg, #6366f1, #22c55e);
}

/* Chat area */
.chat-box {
    flex: 1;
    padding: 15px;
    overflow-y: auto;
    display: flex;
    flex-direction: column;
    gap: 12px;
}

/* Messages */
.message {
    max-width: 75%;
    padding: 12px 14px;
    border-radius: 14px;
    font-size: 14px;
    line-height: 1.4;
}

.user {
    background: linear-gradient(135deg, #3b82f6, #6366f1);
    align-self: flex-end;
}

.bot {
    background: rgba(255,255,255,0.08);
    align-self: flex-start;
}

/* Input area */
.chat-input {
    display: flex;
    padding: 12px;
    background: rgba(0,0,0,0.2);
}

.chat-input input {
    flex: 1;
    padding: 12px;
    border-radius: 10px;
    border: none;
    outline: none;
    background: rgba(255,255,255,0.08);
    color: white;
}

.chat-input button {
    margin-left: 10px;
    padding: 12px 18px;
    border: none;
    border-radius: 10px;
    background: linear-gradient(90deg, #22c55e, #4ade80);
    color: black;
    font-weight: 600;
    cursor: pointer;
    transition: 0.2s;
}

.chat-input button:hover {
    transform: scale(1.05);
}
body {
    height: 100vh;
    background: linear-gradient(-45deg, #0f172a, #020617, #111827, #1e293b);
    background-size: 400% 400%;
    animation: gradientBG 15s ease infinite;
    display: flex;
    justify-content: center;
    align-items: center;
    color: white;
}

/* background animation */
@keyframes gradientBG {
    0% { background-position: 0% 50%; }
    50% { background-position: 100% 50%; }
    100% { background-position: 0% 50%; }
}

</style>
</head>

<body>

<div class="chat-container">
    <div class="chat-header">
        Three-Tap AI
    </div>

    <div class="chat-box" id="chat-box">
        <div class="message bot">
Ask about ranks, cutoffs, IITs, NITs or IIITs.
<br><br>
Give feedback:
<a href="https://forms.gle/4SKyKrjLfARgeEpe6" target="_blank">
Click here
</a>
</div>

    </div>

  <div class="chat-input">
    <input id="user-input" placeholder="Type your question..." />
    <button id="send-btn">Send</button>
</div>
</div>
<script src="script.js"></script>

</body>
</html>
